<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="var(--hero-bg-1)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="var(--hero-edge)" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="var(--hero-edge)" stroke-width="0.5" opacity="0.15"/>

  <!-- Three overlapping circles: product, process, performance -->
  <circle cx="680" cy="380" r="200" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.35"/>
  <circle cx="920" cy="380" r="200" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.35"/>
  <circle cx="800" cy="580" r="200" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.35"/>

  <!-- Gold centre where all three overlap -->
  <circle cx="800" cy="470" r="10" fill="var(--hero-gold)" opacity="0.6"/>

  <!-- Series number -->
  <text x="1530" y="75" text-anchor="end" font-family="Georgia,serif" font-size="52" fill="var(--hero-stone)" opacity="0.25">#21</text>
</svg>
