<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="var(--hero-bg-1)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="var(--hero-edge)" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="var(--hero-edge)" stroke-width="0.5" opacity="0.15"/>

  <!-- Inner circle: "using" -->
  <circle cx="680" cy="450" r="140" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.35"/>
  <circle cx="680" cy="450" r="4" fill="var(--hero-stone)" opacity="0.4"/>

  <!-- Outer circle: "fluent" — larger, offset, gold -->
  <circle cx="880" cy="450" r="290" fill="none" stroke="var(--hero-gold)" stroke-width="2" opacity="0.45"/>
  <circle cx="880" cy="450" r="6" fill="var(--hero-gold)" opacity="0.6"/>

  <!-- Radiating growth arcs from the edge of the small circle to the large -->
  <path d="M 680 310 Q 820 300 880 160" fill="none" stroke="var(--hero-gold)" stroke-width="1" opacity="0.25" stroke-dasharray="4,6"/>
  <path d="M 820 570 Q 900 640 1040 620" fill="none" stroke="var(--hero-gold)" stroke-width="1" opacity="0.25" stroke-dasharray="4,6"/>
  <path d="M 560 520 Q 540 640 640 700" fill="none" stroke="var(--hero-gold)" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>

  <!-- Series number -->
  <text x="1530" y="75" text-anchor="end" font-family="Georgia,serif" font-size="52" fill="var(--hero-stone)" opacity="0.25">#18</text>
</svg>
