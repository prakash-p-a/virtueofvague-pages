<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="var(--hero-bg-1)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="var(--hero-edge)" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="var(--hero-edge)" stroke-width="0.5" opacity="0.15"/>

  <!-- Four pillars, ascending, last one gold -->
  <rect x="260" y="470" width="180" height="230" fill="var(--hero-stone)" opacity="0.08"/>
  <rect x="260" y="470" width="180" height="230" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="350" cy="430" r="22" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.35"/>

  <rect x="500" y="410" width="180" height="290" fill="var(--hero-stone)" opacity="0.1"/>
  <rect x="500" y="410" width="180" height="290" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.32"/>
  <circle cx="590" cy="370" r="22" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.4"/>

  <rect x="740" y="350" width="180" height="350" fill="var(--hero-stone)" opacity="0.12"/>
  <rect x="740" y="350" width="180" height="350" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.35"/>
  <circle cx="830" cy="310" r="22" fill="none" stroke="var(--hero-stone)" stroke-width="1.5" opacity="0.45"/>

  <rect x="980" y="280" width="180" height="420" fill="var(--hero-gold)" opacity="0.09"/>
  <rect x="980" y="280" width="180" height="420" fill="none" stroke="var(--hero-gold)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="1070" cy="240" r="22" fill="none" stroke="var(--hero-gold)" stroke-width="1.5" opacity="0.6"/>

  <!-- Connecting dashed line across the four -->
  <line x1="350" y1="430" x2="1070" y2="240" stroke="var(--hero-gold)" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>

  <!-- Series number -->
  <text x="1530" y="75" text-anchor="end" font-family="Georgia,serif" font-size="52" fill="var(--hero-stone)" opacity="0.25">#19</text>
</svg>
